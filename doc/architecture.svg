<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 780" font-family="Helvetica, Arial, sans-serif">
  <title>iam architecture</title>
  <desc>
    Hexagonal architecture of the iam service. Driving adapters (internal/web,
    internal/service) sit behind RequireAuth and call into internal/controller,
    which depends only on internal/ports. Driven adapters (kubestore, kubecrypt,
    kuberbac, system) implement those ports and talk to the Kubernetes API
    server. kuberbac writes ecp's Role/RoleAssignment CRDs directly as a
    Kubernetes backchannel (ADR 0018); the ecp gateway independently reads
    those objects and validates JWTs issued by iam, with no direct call
    between the two services.
  </desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5a68"/>
    </marker>
    <marker id="arrowDashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c8996"/>
    </marker>
  </defs>

  <style>
    .box { fill: #eef3f8; stroke: #3d5a75; stroke-width: 1.5; rx: 8; }
    .box-driven { fill: #eef7f0; stroke: #3d7a4f; stroke-width: 1.5; rx: 8; }
    .box-ext { fill: #fdf3e7; stroke: #a5762f; stroke-width: 1.5; rx: 8; }
    .box-client { fill: #f3eef8; stroke: #6a4d94; stroke-width: 1.5; rx: 8; }
    .box-dashed { fill: #f4f4f4; stroke: #7c8996; stroke-width: 1.5; stroke-dasharray: 5 4; rx: 8; }
    .hex { fill: #ffffff; stroke: #24435e; stroke-width: 2.25; }
    .lbl { font-size: 14.5px; font-weight: 700; fill: #16232e; }
    .sub { font-size: 13px; fill: #33424e; }
    .cap { font-size: 12.5px; fill: #4a5c6b; }
    .arr { stroke: #4a5a68; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
    .arrD { stroke: #7c8996; stroke-width: 1.8; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrowDashed); }
  </style>

  <rect x="0" y="0" width="1320" height="780" fill="#ffffff"/>
  <text x="660" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#16232e">iam — hexagonal architecture</text>
  <text x="660" y="50" text-anchor="middle" font-size="13" fill="#4a5c6b">driving adapters &#8213; core &#8213; driven adapters &#8213; Kubernetes / ecp</text>

  <!-- Clients -->
  <rect class="box-client" x="20" y="160" width="175" height="75"/>
  <text x="107" y="192" text-anchor="middle" class="lbl">Browser / human</text>
  <text x="107" y="212" text-anchor="middle" class="sub">signs in at /web/login</text>

  <rect class="box-client" x="20" y="420" width="175" height="85"/>
  <text x="107" y="447" text-anchor="middle" class="lbl">API client</text>
  <text x="107" y="466" text-anchor="middle" class="sub">bearer PAT</text>
  <text x="107" y="484" text-anchor="middle" class="sub">(a signed JWT, ADR 0012)</text>

  <!-- Driving adapters -->
  <rect class="box" x="235" y="150" width="190" height="100"/>
  <text x="330" y="178" text-anchor="middle" class="lbl">internal/web</text>
  <text x="330" y="198" text-anchor="middle" class="sub">HTML UI · /web/*</text>
  <text x="330" y="216" text-anchor="middle" class="sub">requireAuth</text>
  <text x="330" y="234" text-anchor="middle" class="cap">(driving adapter)</text>

  <rect class="box" x="235" y="410" width="190" height="100"/>
  <text x="330" y="438" text-anchor="middle" class="lbl">internal/service</text>
  <text x="330" y="458" text-anchor="middle" class="sub">JSON/REST · /api/*</text>
  <text x="330" y="476" text-anchor="middle" class="sub">RequireAuth</text>
  <text x="330" y="494" text-anchor="middle" class="cap">(driving adapter)</text>

  <line class="arr" x1="195" y1="197" x2="233" y2="200"/>
  <line class="arr" x1="195" y1="462" x2="233" y2="460"/>

  <!-- Core hexagon -->
  <polygon class="hex" points="500,90 745,90 790,145 790,465 745,520 500,520 455,465 455,145"/>
  <text x="622" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#24435e">the core (framework-free)</text>

  <rect x="485" y="140" width="275" height="175" fill="#ffffff" stroke="#24435e" stroke-width="1" rx="6"/>
  <text x="622" y="163" text-anchor="middle" class="lbl">internal/controller</text>
  <text x="622" y="184" text-anchor="middle" class="sub">CreateTenant · DeleteTenant</text>
  <text x="622" y="201" text-anchor="middle" class="sub">RepairTenant · CreateUser</text>
  <text x="622" y="218" text-anchor="middle" class="sub">CreateGrant · CreatePAT</text>
  <text x="622" y="235" text-anchor="middle" class="sub">AuthenticateUser · ...</text>
  <text x="622" y="257" text-anchor="middle" class="cap">(business logic, ADR 0014)</text>
  <text x="622" y="274" text-anchor="middle" class="cap">depends only on ports below</text>

  <rect x="485" y="330" width="275" height="160" fill="#ffffff" stroke="#24435e" stroke-width="1" rx="6"/>
  <text x="622" y="353" text-anchor="middle" class="lbl">internal/ports</text>
  <text x="622" y="374" text-anchor="middle" class="sub">UserStore · TenantStore</text>
  <text x="622" y="391" text-anchor="middle" class="sub">GrantStore · PATStore</text>
  <text x="622" y="408" text-anchor="middle" class="sub">TenantRoleStore</text>
  <text x="622" y="425" text-anchor="middle" class="sub">Signer · Clock</text>
  <text x="622" y="446" text-anchor="middle" class="cap">(interfaces, ADR 0013)</text>

  <line class="arr" x1="425" y1="200" x2="453" y2="220"/>
  <line class="arr" x1="425" y1="460" x2="453" y2="435"/>

  <!-- Driven adapters -->
  <rect class="box-driven" x="850" y="25" width="230" height="105"/>
  <text x="965" y="50" text-anchor="middle" class="lbl">adapter/kubestore</text>
  <text x="965" y="70" text-anchor="middle" class="sub">User/Tenant/Grant/PATStore</text>
  <text x="965" y="87" text-anchor="middle" class="sub">ConfigMaps &amp; Secrets (ADR 0001)</text>
  <text x="965" y="107" text-anchor="middle" class="cap">loaded at startup (ADR 0009)</text>

  <rect class="box-driven" x="850" y="145" width="230" height="90"/>
  <text x="965" y="170" text-anchor="middle" class="lbl">adapter/kubecrypt</text>
  <text x="965" y="190" text-anchor="middle" class="sub">Signer</text>
  <text x="965" y="208" text-anchor="middle" class="sub">ES256 key in a Secret (ADR 0005)</text>

  <rect class="box-driven" x="850" y="250" width="230" height="120"/>
  <text x="965" y="275" text-anchor="middle" class="lbl">adapter/kuberbac</text>
  <text x="965" y="295" text-anchor="middle" class="sub">TenantRoleStore</text>
  <text x="965" y="312" text-anchor="middle" class="sub">writes ecp's Role/RoleAssignment</text>
  <text x="965" y="329" text-anchor="middle" class="sub">CRDs — Kubernetes backchannel</text>
  <text x="965" y="349" text-anchor="middle" class="cap">(ADR 0018, not ecp's REST API)</text>

  <rect class="box-driven" x="850" y="385" width="230" height="70"/>
  <text x="965" y="410" text-anchor="middle" class="lbl">adapter/system</text>
  <text x="965" y="430" text-anchor="middle" class="sub">Clock — wall-clock time</text>

  <rect class="box-dashed" x="850" y="470" width="230" height="90"/>
  <text x="965" y="495" text-anchor="middle" class="lbl">in-memory test doubles</text>
  <text x="965" y="514" text-anchor="middle" class="sub">memorystore · memoryrbac</text>
  <text x="965" y="531" text-anchor="middle" class="cap">memorycrypto (ADR 0017)</text>

  <line class="arr" x1="760" y1="355" x2="848" y2="65"/>
  <line class="arr" x1="760" y1="375" x2="848" y2="180"/>
  <line class="arr" x1="760" y1="395" x2="848" y2="295"/>
  <line class="arr" x1="760" y1="415" x2="848" y2="415"/>

  <!-- External systems -->
  <rect class="box-ext" x="1110" y="20" width="200" height="300"/>
  <text x="1210" y="46" text-anchor="middle" class="lbl">Kubernetes API server</text>
  <text x="1210" y="75" text-anchor="middle" class="sub">iam's own state:</text>
  <text x="1210" y="93" text-anchor="middle" class="sub">ConfigMaps &amp; Secrets</text>
  <text x="1210" y="111" text-anchor="middle" class="sub">(kubestore, kubecrypt)</text>
  <line x1="1125" y1="135" x2="1295" y2="135" stroke="#d8c39a" stroke-width="1"/>
  <text x="1210" y="163" text-anchor="middle" class="sub">ecp's namespaced</text>
  <text x="1210" y="181" text-anchor="middle" class="sub">Role / RoleAssignment CRDs,</text>
  <text x="1210" y="199" text-anchor="middle" class="sub">in ecp's computed tenant</text>
  <text x="1210" y="217" text-anchor="middle" class="sub">namespace (hash of tenantId)</text>
  <text x="1210" y="245" text-anchor="middle" class="cap">written by kuberbac,</text>
  <text x="1210" y="262" text-anchor="middle" class="cap">read by ecp's gateway</text>

  <line class="arr" x1="1080" y1="65" x2="1108" y2="90"/>
  <line class="arr" x1="1080" y1="180" x2="1108" y2="135"/>
  <line class="arr" x1="1080" y1="295" x2="1108" y2="190"/>

  <rect class="box-ext" stroke-dasharray="5 4" x="1110" y="440" width="200" height="145"/>
  <text x="1210" y="465" text-anchor="middle" class="lbl">ecp gateway</text>
  <text x="1210" y="486" text-anchor="middle" class="sub">validates JWTs issued</text>
  <text x="1210" y="503" text-anchor="middle" class="sub">by iam (iss/aud, ADR 0003)</text>
  <text x="1210" y="524" text-anchor="middle" class="sub">reads the Role/RoleAssignment</text>
  <text x="1210" y="541" text-anchor="middle" class="sub">objects above</text>
  <text x="1210" y="561" text-anchor="middle" class="cap">never called by iam directly</text>

  <line class="arrD" x1="1210" y1="400" x2="1210" y2="438"/>

  <!-- issued JWT used directly against ecp -->
  <path class="arrD" d="M 107,507 C 107,660 1108,660 1108,490" />
  <text x="600" y="690" text-anchor="middle" class="cap">issued PAT (JWT) is used directly against ecp's API — iam is never in that request path (ADR 0012)</text>

  <!-- Legend -->
  <line class="arr" x1="40" y1="735" x2="80" y2="735"/>
  <text x="88" y="740" class="cap">calls / writes</text>
  <line class="arrD" x1="230" y1="735" x2="270" y2="735"/>
  <text x="278" y="740" class="cap">reads / validates independently, no direct call</text>
</svg>
