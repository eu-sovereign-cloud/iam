<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" font-family="Helvetica, Arial, sans-serif">
  <title>iam and ecp system context</title>
  <desc>
    System-level view: iam and ecp run as separate services inside the same
    Kubernetes cluster. Today they coordinate only through the Kubernetes
    API: iam writes its own state (ConfigMaps/Secrets) and ecp's
    Role/RoleAssignment CRDs (ADR 0018 backchannel); ecp independently
    reads/writes its own resources in the same API server and validates the
    JWTs iam issues. Once iam's userinfo/JWKS endpoint ships (issue #2),
    ecp will also call iam directly, to check whether a given PAT has been
    revoked. Admins reach iam directly; tenant/workload clients use an
    iam-issued PAT (JWT) directly against ecp's own API.
  </desc>

  <defs>
    <marker id="ctxArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5a68"/>
    </marker>
    <marker id="ctxArrowDashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c8996"/>
    </marker>
  </defs>

  <style>
    .cluster { fill: #fbfbfc; stroke: #7c8996; stroke-width: 2; stroke-dasharray: 8 5; rx: 14; }
    .box-iam { fill: #eef3f8; stroke: #24435e; stroke-width: 2; rx: 10; }
    .box-ecp { fill: #eef7f0; stroke: #3d7a4f; stroke-width: 2; rx: 10; }
    .box-k8s { fill: #fdf3e7; stroke: #a5762f; stroke-width: 2; rx: 10; }
    .box-client { fill: #f3eef8; stroke: #6a4d94; stroke-width: 1.5; rx: 8; }
    .lbl { font-size: 15px; font-weight: 700; fill: #16232e; }
    .lblBig { font-size: 19px; font-weight: 700; fill: #16232e; }
    .sub { font-size: 13px; fill: #33424e; }
    .cap { font-size: 12.5px; fill: #4a5c6b; }
    .arr { stroke: #4a5a68; stroke-width: 1.8; fill: none; marker-end: url(#ctxArrow); }
    .arrD { stroke: #7c8996; stroke-width: 1.8; fill: none; stroke-dasharray: 6 4; marker-end: url(#ctxArrowDashed); }
  </style>

  <rect x="0" y="0" width="1300" height="760" fill="#ffffff"/>
  <text x="650" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#16232e">iam &amp; ecp — system context</text>
  <text x="650" y="50" text-anchor="middle" font-size="13" fill="#4a5c6b">two independent services; ecp will also depend directly on iam's userinfo endpoint (issue #2)</text>

  <!-- Cluster boundary -->
  <rect class="cluster" x="330" y="85" width="650" height="480"/>
  <text x="358" y="112" font-size="14" font-weight="700" fill="#5c6b78">Kubernetes cluster</text>

  <!-- Kubernetes API server -->
  <rect class="box-k8s" x="530" y="135" width="250" height="95"/>
  <text x="655" y="160" text-anchor="middle" class="lbl">Kubernetes API server</text>
  <text x="655" y="180" text-anchor="middle" class="sub">cluster control plane (etcd-backed)</text>
  <text x="655" y="198" text-anchor="middle" class="cap">the only channel between iam and ecp</text>

  <!-- iam -->
  <rect class="box-iam" x="370" y="320" width="250" height="150"/>
  <text x="495" y="350" text-anchor="middle" class="lblBig">iam</text>
  <text x="495" y="372" text-anchor="middle" class="sub">this repo — polyfill identity service</text>
  <text x="495" y="390" text-anchor="middle" class="sub">single Pod, single replica (ADR 0009)</text>
  <text x="495" y="408" text-anchor="middle" class="sub">issues JWTs (PATs) that ecp validates</text>
  <text x="495" y="429" text-anchor="middle" class="cap">manages Users, Tenants, Grants, PATs</text>
  <text x="495" y="445" text-anchor="middle" class="cap">see doc/architecture.svg for internals</text>

  <!-- ecp -->
  <rect class="box-ecp" x="660" y="320" width="270" height="150"/>
  <text x="795" y="350" text-anchor="middle" class="lblBig">ecp</text>
  <text x="795" y="372" text-anchor="middle" class="sub">SECA gateway + control plane</text>
  <text x="795" y="390" text-anchor="middle" class="sub">(separate project, not in this repo)</text>
  <text x="795" y="408" text-anchor="middle" class="sub">validates JWTs issued by iam</text>
  <text x="795" y="429" text-anchor="middle" class="cap">owns Tenant/Workspace/Role/...</text>
  <text x="795" y="445" text-anchor="middle" class="cap">RoleAssignment CRDs in its namespaces</text>

  <!-- iam <-> k8s api -->
  <line class="arr" x1="505" y1="320" x2="598" y2="234"/>
  <text x="365" y="262" class="cap">writes iam's own state</text>
  <text x="365" y="278" class="cap">(ConfigMaps/Secrets, ADR 0001)</text>
  <text x="365" y="294" class="cap">+ ecp's Role/RoleAssignment CRDs</text>
  <text x="365" y="310" class="cap">as a backchannel (ADR 0018)</text>

  <!-- ecp <-> k8s api -->
  <line class="arr" x1="790" y1="320" x2="715" y2="234"/>
  <text x="935" y="262" class="cap">reads/writes its own</text>
  <text x="935" y="278" class="cap">CRDs and namespaces —</text>
  <text x="935" y="294" class="cap">including the Role/</text>
  <text x="935" y="310" class="cap">RoleAssignment iam wrote</text>

  <!-- External: admin/browser -->
  <rect class="box-client" x="40" y="200" width="200" height="70"/>
  <text x="140" y="228" text-anchor="middle" class="lbl">Browser / human</text>
  <text x="140" y="248" text-anchor="middle" class="sub">admin UI at iam's /web</text>

  <rect class="box-client" x="40" y="320" width="200" height="70"/>
  <text x="140" y="348" text-anchor="middle" class="lbl">Admin API client</text>
  <text x="140" y="368" text-anchor="middle" class="sub">PAT-authenticated, iam's /api</text>

  <line class="arr" x1="240" y1="240" x2="368" y2="365"/>
  <line class="arr" x1="240" y1="355" x2="368" y2="390"/>

  <!-- External: tenant / workload client -->
  <rect class="box-client" x="1050" y="320" width="220" height="95"/>
  <text x="1160" y="348" text-anchor="middle" class="lbl">Tenant / workload client</text>
  <text x="1160" y="368" text-anchor="middle" class="sub">holds a PAT (JWT) issued by iam</text>
  <text x="1160" y="386" text-anchor="middle" class="sub">calls ecp's cloud API directly</text>
  <text x="1160" y="402" text-anchor="middle" class="cap">iam is never in this request path</text>

  <line class="arr" x1="1050" y1="408" x2="932" y2="460"/>

  <!-- Planned direct dependency: ecp -> iam userinfo/JWKS (issue #2) -->
  <path class="arrD" d="M 700,470 C 660,510 590,510 560,470" />
  <text x="630" y="590" text-anchor="middle" class="cap">planned: ecp calls iam's /userinfo + JWKS (issue #2) to check PAT revocation</text>
  <text x="630" y="606" text-anchor="middle" class="cap">status — not implemented yet; today, RBAC via the Kubernetes API above is the</text>
  <text x="630" y="622" text-anchor="middle" class="cap">only coordination between the two services</text>

  <!-- Legend -->
  <line class="arr" x1="60" y1="695" x2="100" y2="695"/>
  <text x="108" y="700" class="cap">reads / writes</text>
  <line class="arrD" x1="260" y1="695" x2="300" y2="695"/>
  <text x="308" y="700" class="cap">planned direct dependency, not implemented yet</text>
</svg>
