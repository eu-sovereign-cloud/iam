name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: make build

      - name: Vet
        run: make vet

      - name: Check formatting
        run: make fmt-check

      - name: Test
        run: make test

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

      - name: Vulnerability check
        run: make vuln

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint deploy/helm/iam --set config.jwtIssuer=https://iam.example.com

      - name: Render chart
        run: helm template deploy/helm/iam --set config.jwtIssuer=https://iam.example.com > /dev/null
