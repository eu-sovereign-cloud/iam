name: E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Non-blocking: a kind cluster spin-up is more prone to CI flakiness
    # than the plain build/test/lint gate in ci.yml, so a failure here
    # surfaces without blocking merges (see doc/adr/0011).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: helm/kind-action@v1
        with:
          cluster_name: iam-e2e

      - name: Run end-to-end test
        run: make e2e
