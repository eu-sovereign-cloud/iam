{{/*
Cluster-scoped: internal/adapter/kuberbac writes ecp's Role/RoleAssignment
CRDs (and creates the namespace to hold them, via ensureNamespace) into
per-tenant namespaces computed as hex(SHA3-224(tenantID)) - not
IAM_NAMESPACE - so this can't be scoped to a single namespace (doc/adr/0018,
doc/adr/0020). "namespaces" get/create is also cluster-scoped by nature.
*/}}
{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "iam.fullname" . }}-{{ .Release.Namespace }}
  labels:
    {{- include "iam.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create"]
  - apiGroups: ["authorization.v1.secapi.cloud"]
    resources: ["roles", "role-assignments"]
    verbs: ["get", "list", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "iam.fullname" . }}-{{ .Release.Namespace }}
  labels:
    {{- include "iam.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "iam.fullname" . }}-{{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ include "iam.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
